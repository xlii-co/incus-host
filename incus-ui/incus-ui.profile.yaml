# incus-ui: the Incus web UI, as an Incus OCI application container
# (single process, no init, no nested runtime). The image itself is built
# and published from github.com/minihci/incus-ui; see ../README.md here
# for how this profile deploys it on this specific host.
#
# This is a TEMPLATE — the dollar-brace placeholders below get filled in
# from deploy.env by scripts/deploy.sh, which is how this same file produces a
# correct profile on every host without hand-editing it per deployment.
# Don't apply it directly with "incus profile edit < incus-ui.profile.yaml";
# use scripts/deploy.sh instead.
#
# Internal only: no proxy devices, no public cert. The shared `ingress`
# instance (see ../ingress/) owns the host's public :80/:443 and
# reverse-proxies ${INCUS_UI_DOMAIN} here, over the bridge. This instance
# is a pure static-file server now — the /1.0*-vs-static-UI split (and the
# real Incus API's own address) moved to ingress's own route
# (ingress/routes/incus-ui.caddy), since that's a fact about this
# deployment, not something the UI image itself should need to know.
#
# Static IP, not DHCP: ingress's route to this instance is by IP (see
# ingress/routes/incus-ui.caddy), and this instance's address is also what
# daemon/server-config.yaml's core.https_trusted_proxy names — both need
# it to stay fixed across recreations, which a DHCP lease wouldn't.
#
# Persistent volume (caddy-data) is now just this instance's own access
# log, not ACME state — ingress owns cert issuance now.

name: incus-ui
description: Incus web UI (OCI application container)
config:
  boot.autorestart: "true"
  limits.cpu: "1"
  limits.memory: 512MiB
  environment.INCUS_UI_DOMAIN: "${INCUS_UI_DOMAIN}"
devices:
  eth0:
    type: nic
    network: "${BRIDGE_NETWORK}"
    name: eth0
    ipv4.address: "${INCUS_UI_STATIC_IP}"
  caddy-data:
    type: disk
    source: incus-ui-caddy-data
    path: /data
    pool: "${STORAGE_POOL}"
