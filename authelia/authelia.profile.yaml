# authelia: the traditional username/password login incus-ui's "Login with
# SSO" hands off to — official upstream image (docker.io/authelia/authelia),
# no custom build needed. See ../README.md.
#
# This is a TEMPLATE — dollar-brace placeholders get filled in from deploy.env
# by scripts/deploy.sh. Don't apply it directly; use scripts/deploy.sh.
#
# Internal only: no proxy devices. incus-ui's Caddyfile reverse-proxies
# ${AUTH_DOMAIN} to this instance's static address below, over the bridge —
# never touches the public interface.
#
# Everything under /config is one persistent volume: configuration.yml and
# users_database.yml (pushed in by deploy.sh, never baked into an image),
# the secrets/ subdirectory (generated by scripts/generate-authelia-secrets.sh,
# read via the *_FILE env vars below), and Authelia's own state — db.sqlite3,
# notification.txt — that needs to survive container recreation. Create the
# volume once per host: incus storage volume create ${STORAGE_POOL} authelia-config

name: authelia
description: Traditional login for incus-ui's OIDC SSO (OCI application container)
config:
  boot.autorestart: "true"
  limits.cpu: "1"
  limits.memory: 256MiB
  environment.X_AUTHELIA_CONFIG: /config/configuration.yml
  environment.X_AUTHELIA_CONFIG_FILTERS: template
  environment.AUTH_DOMAIN: "${AUTH_DOMAIN}"
  environment.INCUS_UI_DOMAIN: "${INCUS_UI_DOMAIN}"
  environment.AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /config/secrets/reset_password_jwt_secret
  environment.AUTHELIA_SESSION_SECRET_FILE: /config/secrets/session_secret
  environment.AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /config/secrets/storage_encryption_key
  environment.AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /config/secrets/oidc_hmac_secret
devices:
  eth0:
    type: nic
    network: "${BRIDGE_NETWORK}"
    name: eth0
    ipv4.address: "${AUTHELIA_STATIC_IP}"
  config:
    type: disk
    source: authelia-config
    path: /config
    pool: "${STORAGE_POOL}"
