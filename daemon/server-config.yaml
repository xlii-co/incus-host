# Incus server config — see ../README.md for the full story. A TEMPLATE:
# dollar-brace placeholders are filled in by scripts/deploy.sh's render(),
# and the sentinel line under authorization.scriptlet below is replaced
# with authorization.star's own contents (kept in its own file so it stays
# a real, syntax-highlighted .star file instead of YAML-embedded text).
# Don't repeat that sentinel's literal text anywhere else in this file —
# render_server_config()'s sed matches it by exact substring, anywhere.
#
# Applied via `incus config edit`, which replaces the server's ENTIRE
# config with whatever's piped into it (unlike `incus config set`, which
# only touches the one key named). Safe here because this file is meant to
# be the whole of this Incus host's server config — nothing else sets its
# own keys alongside it. Applying this to a host that already has unrelated
# server config set by other tooling would wipe it; check `incus config
# show` first if you're not sure this host is exclusively deploy.sh's.
#
# authorization.client.{oidc,tls,tls-restricted} need Incus 7.3+ (they
# route which client protocols actually use the scriptlet below). On an
# older Incus, `incus config edit` rejects the whole document over an
# unrecognized key — drop those three lines by hand on such a host.
config:
  core.https_address: "${INCUS_API_ADDR}"
  # Lets Incus log/rate-limit by the real client IP Caddy forwards, not
  # Caddy's own container IP. Not load-bearing for the OIDC flow itself.
  # incus-ui now has a static address (see incus-ui/incus-ui.profile.yaml)
  # specifically so this can be a fixed deploy.env value instead of a
  # live lookup re-run on every deploy.
  core.https_trusted_proxy: "${INCUS_UI_STATIC_IP}"
  oidc.issuer: "https://${AUTH_DOMAIN}"
  oidc.client.id: incus
  oidc.audience: incus
  oidc.scopes: "openid,profile,email,groups,offline_access"
  authorization.client.oidc: scriptlet
  authorization.client.tls: scriptlet
  authorization.client.tls-restricted: scriptlet
  authorization.scriptlet: |
__AUTHORIZATION_SCRIPTLET__
