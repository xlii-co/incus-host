# ingress: the shared public edge, as a plain Incus OCI application
# container — stock Caddy (docker-oci:caddy:2.11.4), no custom build
# needed, since it carries no baked-in content: everything it serves comes
# from routes/*.caddy files pushed into the `ingress-routes` volume below.
# See ../README.md for the full story.
#
# This is a TEMPLATE — dollar-brace placeholders get filled in from
# deploy.env by scripts/deploy.sh. Don't apply it directly with
# "incus profile edit < ingress.profile.yaml"; use scripts/deploy.sh.
#
# Public-facing: this is the one instance that receives real internet
# traffic now, so it owns the host's public :80/:443 via the proxy devices
# below — moved here from incus-ui.profile.yaml, which no longer needs
# them. incus-ui and authelia both stay fully internal.
#
# Two persistent volumes matter: caddy-data holds ACME state (without it,
# every recreation re-requests Let's Encrypt certs from scratch, which
# will eventually hit rate limits — same reasoning incus-ui's profile
# already documented for its own now-removed copy of this device), and
# routes holds the actual site-block files this Caddyfile imports —
# recreating this instance must never wipe those, since they're how every
# project (this repo included) registers its own domain.

name: ingress
description: Shared public edge — owns :80/:443, routes from routes/*.caddy (OCI application container)
config:
  boot.autorestart: "true"
  limits.cpu: "1"
  limits.memory: 256MiB
  environment.ACME_EMAIL: "${ADMIN_EMAIL}"
  environment.INCUS_UI_DOMAIN: "${INCUS_UI_DOMAIN}"
  environment.INCUS_UI_ADDR: "${INCUS_UI_STATIC_IP}:80"
  environment.INCUS_API_ADDR: "${INCUS_API_ADDR}"
  environment.AUTH_DOMAIN: "${AUTH_DOMAIN}"
  environment.AUTHELIA_ADDR: "${AUTHELIA_STATIC_IP}:9091"
devices:
  http:
    connect: tcp:127.0.0.1:80
    listen: tcp:0.0.0.0:80
    type: proxy
  https:
    connect: tcp:127.0.0.1:443
    listen: tcp:0.0.0.0:443
    type: proxy
  caddy-data:
    type: disk
    source: ingress-caddy-data
    path: /data
    pool: "${STORAGE_POOL}"
  routes:
    type: disk
    source: ingress-routes
    path: /etc/caddy/routes
    pool: "${STORAGE_POOL}"
