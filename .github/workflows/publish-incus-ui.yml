name: Publish incus-ui

# Manual only, on purpose — same "publishing is a deliberate, confirmed
# step" policy scripts/publish-incus-ui.sh has always documented; this
# workflow just moves where that manual trigger happens; it doesn't make
# publishing automatic. Run via the Actions tab or:
#   gh workflow run publish-incus-ui.yml -f tag=latest
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        default: latest
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: incus-ui
          file: incus-ui/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/incus-ui:${{ inputs.tag }}
